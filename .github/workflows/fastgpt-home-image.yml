name: Build FastGPT landing page image

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: fastgpt-home-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ghcr.io/labring/fastgpt-home

jobs:
  build-fastgpt-landingpage-images:
    if: github.repository == 'labring/fastgpt-home' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_BAIDU_TONGJI: 49747f8b12850fd2f7824a9b7f3a4467
      NEXT_PUBLIC_CLARITY_TONGJI: ybhfsnxoxi
      NEXT_PUBLIC_BAIDU_KEY: ${{ secrets.NEXT_PUBLIC_BAIDU_KEY }}
      NEXT_PUBLIC_HOME_URL: ${{ secrets.NEXT_PUBLIC_HOME_URL }}
      NEXT_PUBLIC_SITE_VARIANT: cn
      NEXT_PUBLIC_CN_HOME_URL: https://fastgpt.cn
      NEXT_PUBLIC_IO_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_USER_URL: ${{ secrets.NEXT_PUBLIC_USER_URL }}
      NEXT_PUBLIC_FILING_ADDRESS: ${{ secrets.NEXT_PUBLIC_FILING_ADDRESS }}
      NEXT_PUBLIC_POLICE_FILING: ${{ secrets.NEXT_PUBLIC_POLICE_FILING }}
      NEXT_PUBLIC_RYBBIT_TONGJI: ${{ secrets.NEXT_PUBLIC_RYBBIT_TONGJI }}
      NEXT_PUBLIC_RYBBIT_TONGJI_SITEID: ${{ secrets.NEXT_PUBLIC_RYBBIT_TONGJI_SITEID }}
      NEXT_PUBLIC_CRM_API_URL: ${{ secrets.NEXT_PUBLIC_CRM_API_URL }}
      NEXT_PUBLIC_ATTRIBUTION_COOKIE_DOMAIN: '.fastgpt.cn'
      NEXT_PUBLIC_ATTRIBUTION_STORAGE_MODE: ${{ vars.NEXT_PUBLIC_ATTRIBUTION_STORAGE_MODE }}
      NEXT_PUBLIC_ATTRIBUTION_SOURCE: ${{ secrets.NEXT_PUBLIC_ATTRIBUTION_SOURCE }}
      NEXT_PUBLIC_LANGUAGE_REGION: zh-CN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate production CRM configuration
        run: test -n "$NEXT_PUBLIC_CRM_API_URL"
      - name: Identify compilation cache
        id: compilation
        run: node scripts/prepare-build.js
      - uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ steps.compilation.outputs.key }}
          restore-keys: ${{ steps.compilation.outputs.restore-prefix }}
      - name: Install the existing Nginx black-box dependency
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Produce the verified production candidate once
        run: npm run verify:release -- --variant cn --keep-artifacts
      - uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.compilation.outputs.key }}
      - name: Verify packaging inputs
        run: |
          node -e "const {getPublicationInputs,siteArtifactIdentity}=require('./scripts/lib/site-artifact-identity');require('node:fs').writeFileSync('expected-site.json', JSON.stringify(getPublicationInputs(siteArtifactIdentity())))"
          node scripts/verify-site-artifact.js --bundle .release-artifacts/site/cn-configured --identity expected-site.json
      - name: Build and check the actual CN runtime
        run: |
          docker build --file Dockerfile --tag fastgpt-home-verified:${{ github.sha }} .release-artifacts/site/cn-configured
          node scripts/verify-url-alias-blackbox.js --variant cn --image fastgpt-home-verified:${{ github.sha }} --out-dir .release-artifacts/site/cn-configured/payload/out
      - uses: actions/upload-artifact@v4
        with:
          name: verified-production-cn
          path: .release-artifacts
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the verified Docker image
        id: build
        run: |
          docker tag fastgpt-home-verified:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:${{ github.sha }}")"
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v4

      - name: Deploy image and verify rollout
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          umask 077
          export KUBECONFIG="$(mktemp)"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$KUBECONFIG"
          previous_image="$(kubectl get deployment/fastgpt-home -o jsonpath='{.spec.template.spec.containers[?(@.name=="fastgpt-home")].image}')"
          test -n "$previous_image"
          kubectl set image deployment/fastgpt-home "fastgpt-home=$IMAGE_NAME@$IMAGE_DIGEST"
          if ! kubectl rollout status deployment/fastgpt-home --timeout=300s; then
            kubectl set image deployment/fastgpt-home "fastgpt-home=$previous_image"
            kubectl rollout status deployment/fastgpt-home --timeout=300s
            exit 1
          fi
