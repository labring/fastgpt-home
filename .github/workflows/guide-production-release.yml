name: Guide Production Release

on:
  workflow_dispatch:
    inputs:
      cn_rollback_target:
        description: Previous immutable CN image reference
        required: true
        type: string
      io_rollback_target:
        description: Previous production Pages deployment ID, or initial-production for a first publish
        required: true
        type: string
      purge_cloudflare:
        description: Purge Pages URLs after deployment
        required: true
        default: true
        type: boolean
      audit_only:
        description: Capture provider rollback metadata without any build or deployment mutation.
        required: true
        default: false
        type: boolean

concurrency:
  group: guide-production-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  RELEASE_ROOT: release-root

jobs:
  verify:
    if: ${{ inputs.audit_only != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Verify and retain both exact output trees
        run: npm run verify:release -- --retain-success-artifacts "$RELEASE_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: guide-verified-trees-${{ github.sha }}
          path: release-root
          retention-days: 7

  package-variants:
    if: ${{ inputs.audit_only != true }}
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: guide-verified-trees-${{ github.sha }}
          path: release-root
      - name: Guard rollback inputs before artifact mutation
        run: |
          test -n '${{ inputs.cn_rollback_target }}' || { echo 'blocked: missing cn rollback target'; exit 1; }
          test -n '${{ inputs.io_rollback_target }}' || { echo 'blocked: missing io rollback target'; exit 1; }
      - name: Prepare immutable archives from retained trees only
        run: |
          node scripts/release-artifact.js package --out-dir "$RELEASE_ROOT/cn/out" --variant cn --source-commit "$GITHUB_SHA" --rollback-target '${{ inputs.cn_rollback_target }}' --archive-dir release-bundle/cn
          node scripts/release-artifact.js package --out-dir "$RELEASE_ROOT/io/out" --variant io --source-commit "$GITHUB_SHA" --rollback-target '${{ inputs.io_rollback_target }}' --inject-release-headers --archive-dir release-bundle/io
      - uses: actions/upload-artifact@v4
        with:
          name: guide-release-bundle-${{ github.sha }}
          path: release-bundle
          retention-days: 30

  deploy-cn:
    if: ${{ inputs.audit_only != true }}
    needs: package-variants
    runs-on: ubuntu-24.04
    environment: production-cn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guide-release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Guard CN provider credentials before mutation
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo 'blocked: missing KUBE_CONFIG'; exit 1; }
          test -n '${{ inputs.cn_rollback_target }}' || { echo 'blocked: missing cn rollback target'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-kubectl@v4
      - name: Capture provider-derived CN rollback target
        id: cn_rollback
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          KUBE_RAW="$KUBE_CONFIG" KUBE_OUTPUT="$RUNNER_TEMP/kubeconfig" node - <<'NODE'
          const fs = require('node:fs');
          const raw = String(process.env.KUBE_RAW || '');
          if (!raw.trim()) throw new Error('blocked: KUBE_CONFIG is empty');
          let value = raw.trim();
          try {
            const parsed = JSON.parse(value);
            value = typeof parsed === 'string' ? parsed : JSON.stringify(parsed);
          } catch {}
          if (!value.includes('\n') && /\\n/.test(value)) value = value.replace(/\\r?\\n/g, '\n').replace(/\\"/g, '"');
          const looksLikeConfig = (text) => /["']?apiVersion["']?\s*:/i.test(text);
          if (!looksLikeConfig(value)) {
            const compact = value.replace(/\s+/g, '');
            if (/^[A-Za-z0-9+/]+={0,2}$/.test(compact) && compact.length > 32) {
              const decoded = Buffer.from(compact, 'base64').toString('utf8');
              if (looksLikeConfig(decoded)) value = decoded;
            }
          }
          if (!looksLikeConfig(value)) throw new Error('blocked: KUBE_CONFIG format unsupported');
          fs.writeFileSync(process.env.KUBE_OUTPUT, value);
          NODE
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl config view --minify >/dev/null
          current_image=$(KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl get deployment/fastgpt-home -o jsonpath='{.spec.template.spec.containers[?(@.name=="fastgpt-home")].image}')
          test -n "$current_image" || { echo 'blocked: current CN image unavailable'; exit 1; }
          normalized_image="$current_image"
          if ! echo "$current_image" | grep -Eq '@sha256:[a-f0-9]{64}$'; then
            digest=$(docker buildx imagetools inspect "$current_image" --format '{{.Manifest.Digest}}' | tr -d '\r' | tail -n 1)
            echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$' || { echo 'blocked: GHCR image digest lookup failed'; exit 1; }
            normalized_image="${current_image%:*}@$digest"
          fi
          echo "$normalized_image" | grep -Eq '^.+@sha256:[a-f0-9]{64}$' || { echo 'blocked: normalized CN image is not immutable'; exit 1; }
          test "$normalized_image" = '${{ inputs.cn_rollback_target }}' || { echo 'blocked: cn rollback input does not match normalized provider image'; exit 1; }
          printf 'target=%s\nimageDigest=%s\n' "$normalized_image" "${normalized_image##*@}" >> "$GITHUB_OUTPUT"
      - name: Verify and extract exact CN archive
        id: cn_identity
        run: |
          archive=$(find release-bundle/cn -name '*.tar.gz' -print -quit)
          test -n "$archive" || { echo 'blocked: CN release archive missing'; exit 1; }
          archive_dir=$(dirname "$archive")
          archive_name=$(basename "$archive")
          (cd "$archive_dir" && sha256sum -c "$archive_name.sha256")
          mkdir release-out && tar -xzf "$archive" -C .
          test -f release-out/__release/manifest.json
          node scripts/release-artifact.js verify --out-dir release-out --variant cn --archive "$archive"
          ARCHIVE="$archive" node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('release-out/__release/manifest.json'));const a=fs.readFileSync(process.env.ARCHIVE+'.sha256','utf8').trim().split(/\\s+/)[0];for(const [k,v] of Object.entries({revision:m.releaseRevision,tree:m.treeDigest,archive:a}))fs.appendFileSync(process.env.GITHUB_OUTPUT,k+'='+v+'\\n')"
      - id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: release-runtime
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            RELEASE_SOURCE_COMMIT=${{ github.sha }}
            RELEASE_TREE_DIGEST=${{ steps.cn_identity.outputs.tree }}
            RELEASE_ARTIFACT_ID=${{ steps.cn_identity.outputs.revision }}
            RELEASE_ROLLBACK_TARGET=${{ steps.cn_rollback.outputs.target }}
            RELEASE_PROVIDER=kubernetes
      - name: Resolve immutable CN image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ROLLBACK_TARGET: ${{ steps.cn_rollback.outputs.target }}
        run: |
          test -n "$IMAGE_DIGEST" || { echo 'blocked: image digest unavailable'; exit 1; }
          test -n "$ROLLBACK_TARGET" || { echo 'blocked: provider rollback target unavailable'; exit 1; }
      - name: Roll out digest-pinned CN image
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -s "$RUNNER_TEMP/kubeconfig" || { echo 'blocked: decoded kubeconfig unavailable'; exit 1; }
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl set image deployment/fastgpt-home fastgpt-home="$IMAGE_NAME@$IMAGE_DIGEST"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl rollout status deployment/fastgpt-home --timeout=5m
      - name: Write final CN provider receipt after rollout
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ARCHIVE_DIGEST: ${{ steps.cn_identity.outputs.archive }}
          ROLLBACK_TARGET: ${{ steps.cn_rollback.outputs.target }}
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('release-out/__release/manifest.json'));if(!process.env.ROLLBACK_TARGET)throw new Error('blocked: provider rollback target missing');fs.writeFileSync('cn-provider-receipt.json',JSON.stringify({schemaVersion:1,variant:'cn',releaseRevision:m.releaseRevision,artifactDigest:m.artifactDigest,treeDigest:m.treeDigest,archiveDigest:process.env.ARCHIVE_DIGEST,rollbackTarget:process.env.ROLLBACK_TARGET,provider:{imageDigest:process.env.IMAGE_DIGEST,kubernetesImage:process.env.IMAGE_NAME+'@'+process.env.IMAGE_DIGEST,rollout:{status:'completed',deployment:'fastgpt-home'}},workflowRun:process.env.GITHUB_RUN_ID},null,2)+'\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: guide-cn-provider-evidence-${{ github.sha }}
          path: cn-provider-receipt.json
          retention-days: 30

  deploy-io:
    if: ${{ inputs.audit_only != true }}
    needs: package-variants
    runs-on: ubuntu-24.04
    env:
      PROJECT_NAME: fastgpt-home
    environment: production-io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: guide-release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Guard IO provider credentials before mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'blocked: missing Cloudflare token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'blocked: missing Cloudflare account'; exit 1; }
          test -n '${{ inputs.io_rollback_target }}' || { echo 'blocked: missing io rollback target'; exit 1; }
      - name: Capture provider-derived IO rollback target
        id: io_rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_INPUT: ${{ inputs.io_rollback_target }}
        run: |
          ./node_modules/.bin/wrangler pages deployment list --project-name="$PROJECT_NAME" --json > io-previous-deployments.json
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('io-previous-deployments.json'));
          const rows = Array.isArray(raw) ? raw : (raw.result || []);
          const isProductionActive = (row) => String(row?.Environment || row?.environment || '').toLowerCase() === 'production' && String(row?.Status || row?.status || '').toLowerCase() === 'active';
          const deployment = rows.find(isProductionActive);
          if (!deployment) {
            if (process.env.ROLLBACK_INPUT !== 'initial-production') throw new Error('blocked: active production Pages deployment unavailable; use initial-production only for first publish');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'id=initial-production\nurl=\n');
            process.exit(0);
          }
          const id = deployment.id || deployment.Id || deployment.deployment_id || deployment.short_id;
          const url = deployment.url || deployment.Url || deployment.Deployment || deployment.deployment_url || deployment.metadata?.url || (Array.isArray(deployment.aliases) ? deployment.aliases.find((value) => /^https?:\/\//.test(value)) : null);
          if (!id || !url) throw new Error('blocked: current active production Pages deployment ID/URL unavailable');
          if (id !== process.env.ROLLBACK_INPUT) throw new Error('blocked: io rollback input does not match provider current deployment');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\nurl=${url}\n`);
          NODE
      - name: Verify and extract exact IO archive
        id: io_identity
        run: |
          archive=$(find release-bundle/io -name '*.tar.gz' -print -quit)
          test -n "$archive" || { echo 'blocked: IO release archive missing'; exit 1; }
          archive_dir=$(dirname "$archive")
          archive_name=$(basename "$archive")
          (cd "$archive_dir" && sha256sum -c "$archive_name.sha256")
          mkdir release-out && tar -xzf "$archive" -C .
          node scripts/release-artifact.js verify --out-dir release-out --variant io --archive "$archive"
          ARCHIVE="$archive" node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('release-out/__release/manifest.json'));const a=fs.readFileSync(process.env.ARCHIVE+'.sha256','utf8').trim().split(/\\s+/)[0];for(const [k,v] of Object.entries({revision:m.releaseRevision,tree:m.treeDigest,archive:a}))fs.appendFileSync(process.env.GITHUB_OUTPUT,k+'='+v+'\\n')"
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy release-out --project-name=${{ env.PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
      - name: Record Pages revision, receipt, and optional purge evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          ARCHIVE_DIGEST: ${{ steps.io_identity.outputs.archive }}
          ROLLBACK_ID: ${{ steps.io_rollback.outputs.id }}
          ROLLBACK_URL: ${{ steps.io_rollback.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          ./node_modules/.bin/wrangler pages deployment list --project-name="$PROJECT_NAME" --json > io-deployments.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('release-out/__release/manifest.json'));const rows=JSON.parse(fs.readFileSync('io-deployments.json'));const list=Array.isArray(rows)?rows:(rows.result||[]);const isProductionActive=(row)=>String(row.Environment||row.environment||'').toLowerCase()==='production'&&String(row.Status||row.status||'').toLowerCase()==='active';const d=list.find((row)=>String(row.id||row.Id||row.deployment_id||row.short_id||'')===process.env.DEPLOYMENT_ID)||list.find(isProductionActive);const id=process.env.DEPLOYMENT_ID||d?.id||d?.Id||d?.deployment_id||d?.short_id;const url=process.env.DEPLOYMENT_URL||d?.url||d?.Url||d?.Deployment||d?.deployment_url||d?.metadata?.url||(Array.isArray(d?.aliases)?d.aliases.find((value)=>/^https?:\\/\\//.test(value)):null);if(!id||!url)throw new Error('blocked: Pages deployment action/list ID/URL unavailable');if(!process.env.ROLLBACK_ID)throw new Error('blocked: provider rollback target unavailable');fs.writeFileSync('io-provider-receipt.json',JSON.stringify({schemaVersion:1,variant:'io',releaseRevision:m.releaseRevision,artifactDigest:m.artifactDigest,treeDigest:m.treeDigest,archiveDigest:process.env.ARCHIVE_DIGEST,rollbackTarget:process.env.ROLLBACK_ID,provider:{project:process.env.PROJECT_NAME,deploymentId:id,deploymentUrl:url,deploymentEnvironment:process.env.DEPLOYMENT_ENVIRONMENT||null,previousDeploymentUrl:process.env.ROLLBACK_URL||null},workflowRun:process.env.GITHUB_RUN_ID},null,2)+'\\n')"
          if [ '${{ inputs.purge_cloudflare }}' = 'true' ]; then node scripts/purge-cloudflare-cache.js --url https://fastgpt.io/guide --evidence-out io-purge.json; fi
      - uses: actions/upload-artifact@v4
        with:
          name: guide-io-provider-evidence-${{ github.sha }}
          path: |
            io-provider-receipt.json
            io-previous-deployments.json
            io-deployments.json
            io-purge.json
          if-no-files-found: ignore
          retention-days: 30

  provider-audit:
    if: ${{ inputs.audit_only == true }}
    runs-on: ubuntu-24.04
    env:
      PROJECT_NAME: fastgpt-home
    steps:
      - uses: azure/setup-kubectl@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard CN audit credential
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo 'blocked: missing KUBE_CONFIG'; exit 1; }
      - name: Read current CN rollback metadata
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          KUBE_RAW="$KUBE_CONFIG" KUBE_OUTPUT="$RUNNER_TEMP/kubeconfig" node - <<'NODE'
          const fs = require('node:fs');
          const raw = String(process.env.KUBE_RAW || '');
          if (!raw.trim()) throw new Error('blocked: KUBE_CONFIG is empty');
          let value = raw.trim();
          try {
            const parsed = JSON.parse(value);
            value = typeof parsed === 'string' ? parsed : JSON.stringify(parsed);
          } catch {}
          if (!value.includes('\n') && /\\n/.test(value)) value = value.replace(/\\r?\\n/g, '\n').replace(/\\"/g, '"');
          const looksLikeConfig = (text) => /["']?apiVersion["']?\s*:/i.test(text);
          if (!looksLikeConfig(value)) {
            const compact = value.replace(/\s+/g, '');
            if (/^[A-Za-z0-9+/]+={0,2}$/.test(compact) && compact.length > 32) {
              const decoded = Buffer.from(compact, 'base64').toString('utf8');
              if (looksLikeConfig(decoded)) value = decoded;
            }
          }
          if (!looksLikeConfig(value)) throw new Error('blocked: KUBE_CONFIG format unsupported');
          fs.writeFileSync(process.env.KUBE_OUTPUT, value);
          NODE
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl config view --minify >/dev/null
          current_image=$(KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl get deployment/fastgpt-home -o jsonpath='{.spec.template.spec.containers[?(@.name=="fastgpt-home")].image}')
          namespace=$(KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl config view --minify -o jsonpath='{.contexts[0].context.namespace}')
          test -n "$current_image" || { echo 'blocked: current CN deployment image unavailable'; exit 1; }
          normalized_image="$current_image"
          if ! echo "$current_image" | grep -Eq '@sha256:[a-f0-9]{64}$'; then
            digest=$(docker buildx imagetools inspect "$current_image" --format '{{.Manifest.Digest}}' | tr -d '\r' | tail -n 1)
            echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$' || { echo 'blocked: GHCR image digest lookup failed'; exit 1; }
            normalized_image="${current_image%:*}@$digest"
          fi
          echo "$normalized_image" | grep -Eq '^.+@sha256:[a-f0-9]{64}$' || { echo 'blocked: normalized CN image is not immutable'; exit 1; }
          CURRENT_IMAGE="$current_image" NORMALIZED_IMAGE="$normalized_image" IMAGE_DIGEST="${normalized_image##*@}" NAMESPACE="$namespace" node - <<'NODE'
          const fs = require('node:fs');
          const image = process.env.CURRENT_IMAGE;
          fs.writeFileSync('provider-audit-cn.json', `${JSON.stringify({
            schemaVersion: 1,
            capturedAt: new Date().toISOString(),
            provider: 'kubernetes',
            deployment: 'fastgpt-home',
            namespace: process.env.NAMESPACE || null,
            sourceImage: image,
            rollbackTarget: process.env.NORMALIZED_IMAGE,
            imageDigest: process.env.IMAGE_DIGEST,
            readOnly: true,
          }, null, 2)}\n`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked Wrangler CLI without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Guard IO audit credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'blocked: missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'blocked: missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$PROJECT_NAME" || { echo 'blocked: missing Cloudflare Pages project name'; exit 1; }
      - name: Read current IO Pages rollback metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          ./node_modules/.bin/wrangler pages deployment list --project-name="$PROJECT_NAME" --json > "$RUNNER_TEMP/io-deployments.json"
          wrangler_status=$?
          set -e
          WRANGLER_STATUS="$wrangler_status" node - <<'NODE'
          const fs = require('node:fs');
          const outputPath = 'provider-audit-io.json';
          const sourcePath = process.env.RUNNER_TEMP + '/io-deployments.json';
          const redact = (value, key = '') => {
            if (/token|secret|password|authorization|credential|private.?key/i.test(key)) return '<redacted>';
            if (Array.isArray(value)) return value.slice(0, 5).map((item) => redact(item));
            if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).slice(0, 30).map(([k, v]) => [k, redact(v, k)]));
            if (typeof value === 'string' && value.length > 512) return `${value.slice(0, 512)}<truncated>`;
            return value;
          };
          const report = {
            schemaVersion: 1,
            capturedAt: new Date().toISOString(),
            provider: 'cloudflare-pages',
            project: process.env.PROJECT_NAME,
            readOnly: true,
            status: 'blocked',
            diagnostics: { wranglerExitCode: Number(process.env.WRANGLER_STATUS || 1) },
          };
          let raw;
          let rawText = '';
          try {
            rawText = fs.readFileSync(sourcePath, 'utf8');
            raw = JSON.parse(rawText);
          } catch (error) {
            report.blockedReason = 'wrangler output was not valid JSON';
            report.diagnostics.parseError = error.name;
            report.diagnostics.outputBytes = Buffer.byteLength(rawText);
            fs.writeFileSync(outputPath, `${JSON.stringify(report, null, 2)}\n`);
            console.error(`[provider-audit] ${JSON.stringify(report.diagnostics)}`);
            process.exitCode = 1;
          }
          if (!raw) {
            report.blockedReason ||= 'Wrangler returned an empty JSON value';
            fs.writeFileSync(outputPath, `${JSON.stringify(report, null, 2)}\n`);
            console.error(`[provider-audit] ${JSON.stringify(report.diagnostics)}`);
            process.exitCode = 1;
          }
          if (raw) {
            const rows = Array.isArray(raw) ? raw : Array.isArray(raw.result) ? raw.result : [];
            const isProductionActive = (row) => String(row?.Environment || row?.environment || '').toLowerCase() === 'production' && String(row?.Status || row?.status || '').toLowerCase() === 'active';
            const candidates = rows.filter(isProductionActive);
            const first = (candidates[0] || rows[0]) && typeof (candidates[0] || rows[0]) === 'object' ? (candidates[0] || rows[0]) : null;
            report.diagnostics.rawType = Array.isArray(raw) ? 'array' : typeof raw;
            report.diagnostics.topLevelKeys = raw && typeof raw === 'object' && !Array.isArray(raw) ? Object.keys(raw).slice(0, 30) : [];
            report.diagnostics.rowsLength = rows.length;
            report.diagnostics.productionActiveCandidates = candidates.length;
            report.diagnostics.selectionMode = candidates.length ? 'production-active' : 'fallback-first';
            report.diagnostics.firstObjectKeys = first ? Object.keys(first).slice(0, 30) : [];
            report.diagnostics.firstObjectValues = first ? redact(first) : null;
            const deploymentId = first?.id || first?.Id || first?.deployment_id || first?.short_id || null;
            const deploymentUrl = first?.url || first?.Url || first?.Deployment || first?.deployment_url || first?.metadata?.url || (Array.isArray(first?.aliases) ? first.aliases.find((value) => /^https?:\/\//.test(value)) : null) || null;
            if (!deploymentId || !deploymentUrl || !candidates.length) {
              report.blockedReason = !rows.length ? 'Pages deployment list is empty' : !candidates.length ? 'Pages deployment list has no active production row' : 'current production Pages deployment is missing id or url';
              report.diagnostics.derivedId = deploymentId;
              report.diagnostics.derivedUrl = deploymentUrl;
              process.exitCode = 1;
            } else {
              report.status = 'ready';
              report.rollbackTarget = deploymentId;
              report.deploymentId = deploymentId;
              report.deploymentUrl = deploymentUrl;
            }
            fs.writeFileSync(outputPath, `${JSON.stringify(report, null, 2)}\n`);
            if (report.status === 'blocked') console.error(`[provider-audit] ${JSON.stringify(report.diagnostics)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-audit-cn-${{ github.run_id }}
          path: provider-audit-cn.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-audit-io-${{ github.run_id }}
          path: provider-audit-io.json
          if-no-files-found: warn
          retention-days: 7

  evidence:
    if: ${{ inputs.audit_only != true }}
    needs: [deploy-cn, deploy-io]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guide-cn-provider-evidence-${{ github.sha }}
          path: evidence/cn
      - uses: actions/download-artifact@v4
        with:
          name: guide-io-provider-evidence-${{ github.sha }}
          path: evidence/io
      - name: Fail closed on public Guide, cache, manifest, and provider evidence drift
        run: node scripts/verify-guide-live.js --base-url-cn https://fastgpt.cn --base-url-io https://fastgpt.io --provider-evidence evidence/cn/cn-provider-receipt.json --provider-evidence evidence/io/io-provider-receipt.json --report guide-live-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: guide-live-evidence-${{ github.sha }}
          path: |
            guide-live-evidence.json
            guide-live-evidence.json.txt
          retention-days: 30
