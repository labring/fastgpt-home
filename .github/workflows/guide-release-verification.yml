name: Guide Release Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/guide-release-verification.yml'
      - '.github/workflows/fastgpt-home-image.yml'
      - 'src/**'
      - 'content/**'
      - 'content/competitors/**'
      - 'public/**'
      - 'scripts/**'
      - 'docs/release/**'
      - 'scripts/verify-content-hygiene.js'
      - 'scripts/fix-html-lang.js'
      - 'Dockerfile.verify'
      - 'Dockerfile'
      - '.dockerignore'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - 'nginx.conf'
      - 'nginx-security-headers.conf'
      - 'nginx-embeddable-security-headers.conf'

concurrency:
  group: guide-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [cn, io, preview]
    env:
      NEXT_PUBLIC_SITE_VARIANT: ${{ matrix.variant }}
      NEXT_PUBLIC_HOME_URL: ${{ matrix.variant == 'cn' && 'https://fastgpt.cn' || 'https://fastgpt.io' }}
      NEXT_PUBLIC_CN_HOME_URL: https://fastgpt.cn
      NEXT_PUBLIC_IO_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_LANGUAGE_REGION: ${{ matrix.variant == 'cn' && 'zh-CN' || 'en-US' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Identify compilation cache
        id: compilation
        run: node scripts/prepare-build.js

      - name: Restore compatible compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ steps.compilation.outputs.key }}
          restore-keys: ${{ steps.compilation.outputs.restore-prefix }}

      - name: Verify isolated Site Variant
        run: npm run verify:release -- --variant ${{ matrix.variant }} --keep-artifacts

      - name: Save compatible compilation cache
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.compilation.outputs.key }}

      - name: Upload release verification record and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-content-release-evidence-${{ matrix.variant }}
          path: .release-artifacts
          retention-days: 90
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Summarize website verification
        if: always()
        run: |
          {
            echo '## Website verification'
            echo '- Record: `.release-artifacts/release-verification.json`'
            echo '- Uploaded artifact: `technical-content-release-evidence-${{ matrix.variant }}` (90-day retention)'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-runtime:
    name: Verify Docker runtime
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image and validate Nginx
        run: |
          docker build --target runtime \
            --build-arg NEXT_PUBLIC_SITE_VARIANT=cn \
            --build-arg NEXT_PUBLIC_HOME_URL=https://fastgpt.cn \
            --build-arg NEXT_PUBLIC_CN_HOME_URL=https://fastgpt.cn \
            --build-arg NEXT_PUBLIC_IO_HOME_URL=https://fastgpt.io \
            --tag fastgpt-home-runtime:${{ github.sha }} .
