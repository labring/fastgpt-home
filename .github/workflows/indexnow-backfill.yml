name: Manual IndexNow Backfill

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Target production site variant
        required: true
        type: choice
        default: cn
        options:
          - cn
          - io
          - both
      mode:
        description: Backfill selection mode
        required: true
        type: choice
        default: recent
        options:
          - recent
          - content
          - urls
          - all
      since_days:
        description: Include URLs whose lastmod is within the last N days (recent mode)
        required: false
        type: string
        default: '45'
      since_date:
        description: Optional YYYY-MM-DD cutoff overriding since_days (recent mode)
        required: false
        type: string
        default: ''
      urls:
        description: Comma or newline separated canonical URLs (urls mode)
        required: false
        type: string
        default: ''
      max_urls:
        description: Maximum URLs to submit per variant (0 = unlimited)
        required: false
        type: string
        default: '10000'
      dry_run:
        description: Preview selection without POSTing to IndexNow
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run IndexNow backfill
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SINCE_DAYS: ${{ inputs.since_days }}
          INPUT_SINCE_DATE: ${{ inputs.since_date }}
          INPUT_URLS: ${{ inputs.urls }}
          INPUT_MAX_URLS: ${{ inputs.max_urls }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_MODE" == "urls" && "$INPUT_VARIANT" == "both" ]]; then
            echo "Select variant=cn or variant=io when mode=urls." >&2
            exit 1
          fi

          if [[ "$INPUT_VARIANT" == "both" ]]; then
            variants=("cn" "io")
          else
            variants=("$INPUT_VARIANT")
          fi

          mkdir -p .indexnow-receipts
          for variant in "${variants[@]}"; do
            args=(
              scripts/submit-indexnow.js
              --mode "$INPUT_MODE"
              --variant "$variant"
              --from-live
              --max-urls "${INPUT_MAX_URLS:-10000}"
              --chunk-size 2000
              --receipt-out ".indexnow-receipts/indexnow-${variant}.json"
            )
            if [[ "$INPUT_MODE" == "recent" ]]; then
              if [[ -n "${INPUT_SINCE_DATE:-}" ]]; then
                args+=(--since-date "$INPUT_SINCE_DATE")
              else
                args+=(--since-days "${INPUT_SINCE_DAYS:-45}")
              fi
            fi
            if [[ "$INPUT_MODE" == "urls" ]]; then
              args+=(--urls "$INPUT_URLS")
            fi
            if [[ "$INPUT_DRY_RUN" == "true" ]]; then
              args+=(--dry-run --verify-live-key)
            fi
            node "${args[@]}"
          done

      - name: Upload IndexNow backfill receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-backfill-receipts-${{ github.run_id }}
          path: .indexnow-receipts
          retention-days: 30
          if-no-files-found: ignore
