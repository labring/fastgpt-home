name: Preview Home Page — Deploy

on:
  workflow_run:
    workflows: ["Preview Home Page — Build"]
    types: [completed]

# Only one deploy at a time; do not cancel in-progress deploys.
concurrency:
  group: 'preview-deploy'
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  pull-requests: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Only deploy when the build succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      NEXT_PUBLIC_POLICE_FILING: '浙公网安备33011002017871号'
      NEXT_PUBLIC_FILING_ADDRESS: '粤ICP备2023048773号'
      NEXT_PUBLIC_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_SITE_VARIANT: preview
      NEXT_PUBLIC_CN_HOME_URL: https://fastgpt.cn
      NEXT_PUBLIC_IO_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_USER_URL: https://cloud.fastgpt.io
      NEXT_PUBLIC_CRM_API_URL: ''
      NEXT_PUBLIC_ATTRIBUTION_SOURCE: ''
      NEXT_PUBLIC_LANGUAGE_REGION: en-US
    steps:
      # Only default-branch verification code runs in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          path: verifier
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: verified-preview
          path: verified-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-source
          path: source
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate run and merge-result metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const resolve = require('./verifier/scripts/lib/preview-run-inputs.js');
            const selection = JSON.parse(fs.readFileSync('source/preview-selection.json'));
            const source = JSON.parse(fs.readFileSync('source/.release-artifacts/source-verification.json'));
            const inputs = await resolve(github, context, selection, source);
            for (const [key, value] of Object.entries(inputs)) core.setOutput(key, value);
      - name: Read candidate inputs without executing candidate code
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ steps.pr.outputs.revision }}
          persist-credentials: false
      - name: Verify expected publication identity and complete artifact digest
        env:
          VERIFIED_PREVIEW_REVISION: ${{ steps.pr.outputs.revision }}
        run: node verifier/scripts/verify-preview-artifact.js --bundle verified-preview --candidate candidate --revision "$VERIFIED_PREVIEW_REVISION"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy ./verified-preview/payload/out --project-name=fastgpt-home --branch=${{ steps.pr.outputs.branch }}
          quiet: false

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        if: success() && steps.pr.outputs.number != ''
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');
            const deployUrl = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- fastgpt-home-preview -->';
            const deployedAt = new Date().toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              hour12: false,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });
            const body = `${marker}
            🚀 **FastGPT Homepage Preview Ready!**

            📱 **Preview URL:** ${deployUrl}

            🕒 **Updated At:** ${deployedAt} (UTC+8)

            🔗 [👀 Click here to visit preview](${deployUrl})

            ---
            💡 This preview will be automatically updated when you push new commits to this PR.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
