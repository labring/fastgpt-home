name: Preview Home Page — Deploy Worker

on:
  workflow_run:
    workflows: ['Preview Home Page — Build']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Preview Home Page — Build run to deploy'
        required: true
        type: string

# Serialize every preview Worker mutation with cleanup so a closed PR cannot
# race a deployment for the same Worker.
concurrency:
  group: preview-worker-publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Deploy completed builds or an explicitly selected successful build artifact.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: international-worker-production

    env:
      NEXT_PUBLIC_POLICE_FILING: '浙公网安备33011002017871号'
      NEXT_PUBLIC_FILING_ADDRESS: '粤ICP备2023048773号'
      NEXT_PUBLIC_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_SITE_VARIANT: preview
      NEXT_PUBLIC_CN_HOME_URL: https://fastgpt.cn
      NEXT_PUBLIC_IO_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_USER_URL: https://cloud.fastgpt.io
      NEXT_PUBLIC_CRM_API_URL: ''
      NEXT_PUBLIC_ATTRIBUTION_SOURCE: ''
      NEXT_PUBLIC_LANGUAGE_REGION: en-US
      CLOUDFLARE_STATIC_ASSETS_FILE_LIMIT: 100000
    steps:
      # Only default-branch verification code runs in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          path: verifier
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: verified-preview
          path: verified-preview
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify artifact format
        id: format
        uses: actions/github-script@v7
        with:
          script: |
            const manifest = JSON.parse(require('node:fs').readFileSync('verified-preview/manifest.json'));
            if (manifest.kind === 'preview' && manifest.schemaVersion === 1) core.setOutput('legacy', 'false');
            else if (!manifest.kind && manifest.schemaVersion === 2) core.setOutput('legacy', 'true');
            else throw new Error('Unsupported Preview artifact format');
      # Legacy runs keep their source evidence during the protocol migration.
      - uses: actions/download-artifact@v4
        if: steps.format.outputs.legacy == 'true'
        with:
          name: verified-source
          path: source
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate run and merge-result metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const resolve = require('./verifier/scripts/lib/preview-run-inputs.js');
            const manifest = JSON.parse(fs.readFileSync('verified-preview/manifest.json'));
            const runId = context.eventName === 'workflow_dispatch'
              ? Number('${{ inputs.build_run_id }}')
              : context.payload.workflow_run.id;
            if (!Number.isInteger(runId) || runId <= 0) throw new Error('Invalid Preview build run ID');
            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const resolvedContext = {
              repo: context.repo,
              payload: { ...context.payload, workflow_run: workflowRun },
            };
            const inputs = manifest.kind === 'preview'
              ? await resolve(github, resolvedContext, manifest)
              : await resolve(github, resolvedContext,
                  JSON.parse(fs.readFileSync('source/preview-selection.json')),
                  JSON.parse(fs.readFileSync('source/.release-artifacts/source-verification.json')));
            for (const [key, value] of Object.entries(inputs)) core.setOutput(key, value);
      - name: Read candidate inputs without executing candidate code
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ steps.pr.outputs.revision }}
          persist-credentials: false
      - name: Verify expected publication identity and complete artifact digest
        env:
          VERIFIED_PREVIEW_REVISION: ${{ steps.pr.outputs.revision }}
        run: node verifier/scripts/verify-preview-artifact.js --bundle verified-preview --candidate candidate --revision "$VERIFIED_PREVIEW_REVISION" --trusted-config verifier/wrangler.json

      - name: Resolve preview Worker identity
        id: worker
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            worker_name="fastgpt-preview-pr-$PR_NUMBER"
          else
            worker_name="fastgpt-preview-manual-$WORKFLOW_RUN_ID"
          fi
          echo "name=$worker_name" >> "$GITHUB_OUTPUT"

      - name: Deploy verified Preview Worker and Static Assets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: deploy --config ./verified-preview/payload/wrangler.json --name ${{ steps.worker.outputs.name }}
          quiet: false

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        if: success() && steps.pr.outputs.number != ''
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');
            const deployUrl = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- fastgpt-home-preview -->';
            const deployedAt = new Date().toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              hour12: false,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });
            const body = `${marker}
            🚀 **FastGPT Worker Preview Ready!**

            📱 **Preview URL:** ${deployUrl}

            🕒 **Updated At:** ${deployedAt} (UTC+8)

            🔗 [👀 Click here to visit preview](${deployUrl})

            ---
            💡 This preview will be automatically updated when you push new commits to this PR.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
