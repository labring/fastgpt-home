name: Preview Worker — Cleanup

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      worker_name:
        description: Preview Worker name to delete, such as fastgpt-preview-manual-123
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-worker-publish
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    if: github.repository == 'labring/fastgpt-home'
    runs-on: ubuntu-24.04
    environment: international-worker-production
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      INPUT_WORKER_NAME: ${{ inputs.worker_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve preview Worker identity
        id: worker
        run: |
          set -euo pipefail
          if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            worker_name="fastgpt-preview-pr-$PR_NUMBER"
          else
            worker_name="$INPUT_WORKER_NAME"
          fi
          if [[ ! "$worker_name" =~ ^fastgpt-preview-(pr|manual)-[0-9]+$ ]]; then
            echo "Invalid preview Worker name: $worker_name" >&2
            exit 1
          fi
          echo "name=$worker_name" >> "$GITHUB_OUTPUT"

      - name: Recheck pull request status
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pr.state !== 'closed') {
              core.setFailed(`Pull request #${number} is ${pr.state}; refusing cleanup`);
            }

      - name: Delete preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: delete --name ${{ steps.worker.outputs.name }} --force
          quiet: false
