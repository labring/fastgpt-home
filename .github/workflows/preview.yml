name: Preview Home Page — Build

on:
  workflow_dispatch:
  pull_request:

# Only one build per PR branch at a time.
concurrency:
  group: 'preview-build-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Public filing text is available to fork PRs without repository secrets.
      NEXT_PUBLIC_POLICE_FILING: '浙公网安备33011002017871号'
      NEXT_PUBLIC_FILING_ADDRESS: '粤ICP备2023048773号'
      NEXT_PUBLIC_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_SITE_VARIANT: preview
      NEXT_PUBLIC_CN_HOME_URL: https://fastgpt.cn
      NEXT_PUBLIC_IO_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_USER_URL: https://cloud.fastgpt.io
      NEXT_PUBLIC_CRM_API_URL: ''
      NEXT_PUBLIC_ATTRIBUTION_SOURCE: ''

    steps:
      - name: Checkout merge result or selected manual revision
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Select CRM build coverage and record revisions
        id: coverage
        run: node scripts/select-preview-builds.js | tee preview-selection.json

      - name: Verify CRM states and build selection
        run: node --test scripts/verify-consultation-attribution.test.js scripts/select-preview-builds.test.js

      - name: Verify footer
        run: node --test scripts/verify-footer-copy.test.js scripts/verify-footer-tech-link.test.js

      - name: Prepare disabled compilation cache
        id: cache-disabled
        run: node scripts/prepare-build.js

      - name: Restore disabled compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-disabled.outputs.key }}
          restore-keys: ${{ steps.cache-disabled.outputs.restore-prefix }}

      - name: Build and verify CRM-disabled preview
        run: |
          rm -rf out
          npm run build
          npm run verify:contact
          npm run verify:i18n-seo
          mv out .preview-build-crm-disabled

      - name: Save disabled compilation cache
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-disabled.outputs.key }}

      - name: Prepare configured compilation cache
        if: steps.coverage.outputs.configured == 'true'
        id: cache-configured
        env:
          NEXT_PUBLIC_CRM_API_URL: https://crm-preview.invalid
        run: node scripts/prepare-build.js

      - name: Restore configured compilation cache
        if: steps.coverage.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-configured.outputs.key }}
          restore-keys: ${{ steps.cache-configured.outputs.restore-prefix }}

      - name: Build and verify configured CRM preview
        if: steps.coverage.outputs.configured == 'true'
        env:
          # Automated form submissions are intercepted by the real-form regression harness.
          NEXT_PUBLIC_CRM_API_URL: https://crm-preview.invalid
        run: |
          rm -rf out
          npm run build
          npm run verify:contact
          npm run verify:i18n-seo
          rm -rf out

      - name: Save configured compilation cache
        if: steps.coverage.outputs.configured == 'true'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-configured.outputs.key }}

      - name: Select CRM-disabled deployment artifact
        run: mv .preview-build-crm-disabled out

      - name: Verify preview filing links
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const html = fs.readFileSync('out/zh.html', 'utf8');
          const footer = html.match(/<footer\b[^>]*>[\s\S]*?<\/footer>/)?.[0];
          assert(footer, 'Chinese preview must render its footer');
          for (const [key, href] of [
            ['NEXT_PUBLIC_POLICE_FILING', 'https://beian.mps.gov.cn/'],
            ['NEXT_PUBLIC_FILING_ADDRESS', 'https://beian.miit.gov.cn/']
          ]) {
            const value = process.env[key];
            assert(value, `${key} must be configured`);
            assert(footer.includes(`href="${href}"`) && footer.includes(value), `${key} must render with its link`);
          }
          console.log('Preview filing links verified');
          NODE

      # Save PR number so the deploy workflow knows which PR to comment on.
      - name: Save PR metadata
        run: echo "${{ github.event.pull_request.number }}" > ./out/pr-number.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: ./out
          retention-days: 1
