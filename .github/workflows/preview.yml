name: Preview Home Page — Build
run-name: Preview ${{ github.event.pull_request.number || github.ref }} / ${{ github.sha }}

on:
  workflow_dispatch:
  pull_request:

# Only one build per PR branch at a time.
concurrency:
  group: 'preview-build-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Public filing text is available to fork PRs without repository secrets.
      NEXT_PUBLIC_POLICE_FILING: '浙公网安备33011002017871号'
      NEXT_PUBLIC_FILING_ADDRESS: '粤ICP备2023048773号'
      NEXT_PUBLIC_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_SITE_VARIANT: preview
      NEXT_PUBLIC_CN_HOME_URL: https://fastgpt.cn
      NEXT_PUBLIC_IO_HOME_URL: https://fastgpt.io
      NEXT_PUBLIC_USER_URL: https://cloud.fastgpt.io
      NEXT_PUBLIC_CRM_API_URL: ''
      NEXT_PUBLIC_LANGUAGE_REGION: en-US
      NEXT_PUBLIC_ATTRIBUTION_SOURCE: ''

    steps:
      - name: Checkout merge result or selected manual revision
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Select CRM build coverage and record revisions
        id: coverage
        run: node scripts/select-preview-builds.js | tee preview-selection.json

      - name: Verify shared source once
        run: npm run verify:release -- --source-only --write-source-record .release-artifacts/source-verification.json

      - name: Retain shared source and revision evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-source
          path: |
            .release-artifacts/source-verification.json
            preview-selection.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Prepare disabled compilation cache
        id: cache-disabled
        run: node scripts/prepare-build.js

      - name: Restore disabled compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-disabled.outputs.key }}
          restore-keys: ${{ steps.cache-disabled.outputs.restore-prefix }}

      - name: Produce verified CRM-disabled preview
        run: npm run verify:release -- --variant preview --reuse-source .release-artifacts/source-verification.json --keep-artifacts

      - name: Save disabled compilation cache
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-disabled.outputs.key }}

      - name: Verify preview filing links
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const html = fs.readFileSync('.release-artifacts/site/preview-disabled/payload/out/zh.html', 'utf8');
          const footer = html.match(/<footer\b[^>]*>[\s\S]*?<\/footer>/)?.[0];
          assert(footer, 'Chinese preview must render its footer');
          for (const [key, href] of [
            ['NEXT_PUBLIC_POLICE_FILING', 'https://beian.mps.gov.cn/'],
            ['NEXT_PUBLIC_FILING_ADDRESS', 'https://beian.miit.gov.cn/']
          ]) {
            const value = process.env[key];
            assert(value, `${key} must be configured`);
            assert(footer.includes(`href="${href}"`) && footer.includes(value), `${key} must render with its link`);
          }
          console.log('Preview filing links verified');
          NODE

      - name: Check out the consumer separately from candidate build dependencies
        uses: actions/checkout@v4
        with:
          path: .preview-verifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            wrangler.json
            scripts/lib/
            scripts/verify-preview-artifact.js
            src/config/site-routing.json

      - name: Exercise the deployment consumer on the complete Preview artifact
        run: node .preview-verifier/scripts/verify-preview-artifact.js --bundle .release-artifacts/site/preview-disabled --candidate . --revision "$(git rev-parse HEAD)" --trusted-config .preview-verifier/wrangler.json

      - name: Upload verified disabled preview
        uses: actions/upload-artifact@v4
        with:
          name: verified-preview
          path: .release-artifacts/site/preview-disabled
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Remove disabled preview before configured build
        run: rm -rf .release-artifacts/site/preview-disabled

      - name: Prepare configured compilation cache
        if: steps.coverage.outputs.configured == 'true'
        id: cache-configured
        env:
          NEXT_PUBLIC_CRM_API_URL: https://crm-preview.invalid
        run: node scripts/prepare-build.js

      - name: Restore configured compilation cache
        if: steps.coverage.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-configured.outputs.key }}
          restore-keys: ${{ steps.cache-configured.outputs.restore-prefix }}

      - name: Produce verified configured CRM preview
        if: steps.coverage.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_CRM_API_URL: https://crm-preview.invalid
        run: npm run verify:release -- --variant preview --reuse-source .release-artifacts/source-verification.json

      - name: Save configured compilation cache
        if: steps.coverage.outputs.configured == 'true'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.cache-configured.outputs.key }}

      - name: Retain configured verification evidence
        if: steps.coverage.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: configured-preview-evidence
          path: .release-artifacts/site/preview-configured
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
