name: Verify 30 published Week05 URLs
on:
  push:
    branches: [verify/week05-live-20260907]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify 30 live URLs, content, canonical, and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, html, json, re, subprocess, sys
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree
          STAGE = Path('.live-verification')
          STAGE.mkdir(exist_ok=True)
          ROOT = Path.cwd()
          
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical=None; self.article=0; self.h1=0; self.body=[]; self.title=[]; self.skip=0
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if tag=='link' and attrs.get('rel')=='canonical': self.canonical=attrs.get('href')
                  if tag=='article': self.article+=1
                  if tag=='h1': self.h1+=1
                  if tag in ('script','style'): self.skip+=1
              def handle_endtag(self,tag):
                  if tag=='article': self.article-=1
                  if tag=='h1': self.h1-=1
                  if tag in ('script','style'): self.skip-=1
              def handle_data(self,data):
                  if self.skip: return
                  if self.article: self.body.append(data)
                  if self.h1: self.title.append(data)
          
          def fetch(url):
              result=subprocess.run(['curl','--silent','--show-error','--connect-timeout','10','--max-time','45','--retry','2','--retry-all-errors','--write-out','\n__STATUS__%{http_code}',url],capture_output=True,text=True)
              if result.returncode: raise RuntimeError(result.stderr.strip())
              body,status=result.stdout.rsplit('\n__STATUS__',1)
              return int(status),body
          
          def normalize(s): return re.sub(r'\s+','',html.unescape(s))
          
          INLINE = re.compile(r'(`[^`]+`|\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*]+)\*|_([^_]+)_)')
          def inline_text(text):
              result=[]; offset=0
              for match in INLINE.finditer(text):
                  result.append(text[offset:match.start()])
                  if match[0].startswith('`'): result.append(match[0][1:-1])
                  else: result.append(inline_text(next(value for value in (match[2],match[4],match[5],match[6],match[7]) if value)))
                  offset=match.end()
              result.append(text[offset:])
              return ''.join(result)
          
          assert inline_text('`node_modules`') == 'node_modules'
          assert inline_text('YOUR_API_KEY') == 'YOURAPIKEY'
          assert inline_text('**text** [source](https://example.com)') == 'text source'
          
          def expected_lines(path):
              body=path.read_text().split('---',2)[2]
              for line in body.splitlines():
                  line=line.strip()
                  if not line or line.startswith(('# ','```')): continue
                  line=re.sub(r'^(?:#{1,6}\s+|>\s*|[-*+]\s+|\d+[.)]\s+)','',line)
                  line=inline_text(line)
                  if len(normalize(line))>=4: yield normalize(line)
          
          def check(item):
              result={'id':item['id'],'url':item['url']}
              try:
                  status,body=fetch(item['url']); page=Page(); page.feed(body)
                  visible=normalize(''.join(page.body)); lines=list(expected_lines(ROOT/'src/content/tech-center'/item['file']))
                  missing=[i+1 for i,line in enumerate(lines) if line not in visible]
                  result.update(status=status,titleMatches=normalize(''.join(page.title))==normalize(item['title']),canonicalMatches=page.canonical==item['url'],bodyMatches=not missing,missingBodyLineNumbers=missing,sitemapMatches=item['url'] in sitemap)
                  result['pass']=status==200 and all(result[k] for k in ('titleMatches','canonicalMatches','bodyMatches','sitemapMatches'))
              except Exception as error: result.update(error=str(error),**{'pass':False})
              return result
          
          status,xml=fetch('https://fastgpt.cn/sitemap.xml')
          assert status==200, f'Sitemap status {status}'
          sitemap={node.text for node in ElementTree.fromstring(xml).iter() if node.tag.endswith('}loc')}
          items=json.loads('[{"id": 29, "url": "https://fastgpt.cn/troubleshoot/fastgpt-api-error-troubleshooting", "title": "FastGPT API调用返回异常的排查与解决方法", "slug": "/zh/troubleshoot/fastgpt-api-error-troubleshooting", "file": "troubleshoot/fastgpt-api-error-troubleshooting.md", "source": "https://github.com/labring/FastGPT/issues/410"}, {"id": 30, "url": "https://fastgpt.cn/troubleshoot/fastgpt-build-discrepancy-server", "title": "解决FastGPT不同运行环境下npm run build编译结果不一致问题", "slug": "/zh/troubleshoot/fastgpt-build-discrepancy-server", "file": "troubleshoot/fastgpt-build-discrepancy-server.md", "source": "https://github.com/labring/FastGPT/issues/1287"}, {"id": 31, "url": "https://fastgpt.cn/troubleshoot/fastgpt-chat-completions-error", "title": "解决FastGPT调用chat/completions接口异常的问题", "slug": "/zh/troubleshoot/fastgpt-chat-completions-error", "file": "troubleshoot/fastgpt-chat-completions-error.md", "source": "https://github.com/labring/FastGPT/issues/396"}, {"id": 32, "url": "https://fastgpt.cn/troubleshoot/fastgpt-deepseek-v3-function-call-error", "title": "解决FastGPT中DeepSeek-V3使用联网搜索工具报400错误的问题", "slug": "/zh/troubleshoot/fastgpt-deepseek-v3-function-call-error", "file": "troubleshoot/fastgpt-deepseek-v3-function-call-error.md", "source": "https://github.com/labring/FastGPT/issues/4023"}, {"id": 33, "url": "https://fastgpt.cn/troubleshoot/fastgpt-deepseek-v3-function-call-error-2", "title": "解决FastGPT中DeepSeek-V3使用联网搜索工具报400错误的问题", "slug": "/zh/troubleshoot/fastgpt-deepseek-v3-function-call-error-2", "file": "troubleshoot/fastgpt-deepseek-v3-function-call-error-2.md", "source": "https://github.com/labring/FastGPT/issues/4031"}, {"id": 34, "url": "https://fastgpt.cn/troubleshoot/fastgpt-docker-build-tiktoken-error", "title": "解决FastGPT Docker镜像构建时tiktoken encoders删除报错问题", "slug": "/zh/troubleshoot/fastgpt-docker-build-tiktoken-error", "file": "troubleshoot/fastgpt-docker-build-tiktoken-error.md", "source": "https://github.com/labring/FastGPT/issues/3248"}, {"id": 35, "url": "https://fastgpt.cn/troubleshoot/fastgpt-docker-deploy-ui-unavailable", "title": "解决FastGPT 4.12.1版本docker部署后界面打不开的问题", "slug": "/zh/troubleshoot/fastgpt-docker-deploy-ui-unavailable", "file": "troubleshoot/fastgpt-docker-deploy-ui-unavailable.md", "source": "https://github.com/labring/FastGPT/issues/5517"}, {"id": 36, "url": "https://fastgpt.cn/troubleshoot/fastgpt-docker-mongo-permission-error", "title": "解决FastGPT Docker部署Mongo容器权限报错退出问题", "slug": "/zh/troubleshoot/fastgpt-docker-mongo-permission-error", "file": "troubleshoot/fastgpt-docker-mongo-permission-error.md", "source": "https://github.com/labring/FastGPT/issues/834"}, {"id": 37, "url": "https://fastgpt.cn/troubleshoot/fastgpt-docker-permission-restart-error", "title": "解决FastGPT私有部署Docker部署时主程序重启的权限报错问题", "slug": "/zh/troubleshoot/fastgpt-docker-permission-restart-error", "file": "troubleshoot/fastgpt-docker-permission-restart-error.md", "source": "https://github.com/labring/FastGPT/issues/5999"}, {"id": 38, "url": "https://fastgpt.cn/troubleshoot/fastgpt-docker-port-fix", "title": "解决FastGPT修改docker-compose端口后的启动异常", "slug": "/zh/troubleshoot/fastgpt-docker-port-fix", "file": "troubleshoot/fastgpt-docker-port-fix.md", "source": "https://github.com/labring/FastGPT/issues/1357"}, {"id": 39, "url": "https://fastgpt.cn/troubleshoot/fastgpt-large-file-upload-troubleshooting", "title": "解决FastGPT私有部署4.8.3版本知识库大文件上传失败问题", "slug": "/zh/troubleshoot/fastgpt-large-file-upload-troubleshooting", "file": "troubleshoot/fastgpt-large-file-upload-troubleshooting.md", "source": "https://github.com/labring/FastGPT/issues/1782"}, {"id": 40, "url": "https://fastgpt.cn/troubleshoot/fastgpt-local-start-heat-update-path-error", "title": "解决FastGPT私有部署4.0版本本地启动热更新与打包路径问题", "slug": "/zh/troubleshoot/fastgpt-local-start-heat-update-path-error", "file": "troubleshoot/fastgpt-local-start-heat-update-path-error.md", "source": "https://github.com/labring/FastGPT/issues/1593"}, {"id": 41, "url": "https://fastgpt.cn/troubleshoot/fastgpt-master-build-copy-error", "title": "解决本地修改FastGPT master分支构建镜像时的文件缺失报错", "slug": "/zh/troubleshoot/fastgpt-master-build-copy-error", "file": "troubleshoot/fastgpt-master-build-copy-error.md", "source": "https://github.com/labring/FastGPT/issues/1707"}, {"id": 42, "url": "https://fastgpt.cn/troubleshoot/fastgpt-mongo-permission-fix", "title": "解决FastGPT私有部署MongoDB权限导致的创建应用失败问题", "slug": "/zh/troubleshoot/fastgpt-mongo-permission-fix", "file": "troubleshoot/fastgpt-mongo-permission-fix.md", "source": "https://github.com/labring/FastGPT/issues/1967"}, {"id": 43, "url": "https://fastgpt.cn/troubleshoot/fastgpt-pg-container-restart-troubleshooting", "title": "解决FastGPT私有部署中PostgreSQL容器反复重启的问题", "slug": "/zh/troubleshoot/fastgpt-pg-container-restart-troubleshooting", "file": "troubleshoot/fastgpt-pg-container-restart-troubleshooting.md", "source": "https://github.com/labring/FastGPT/issues/784"}, {"id": 44, "url": "https://fastgpt.cn/troubleshoot/fastgpt-pg-hostname-resolve-error", "title": "解决FastGPT创建知识库时getaddrinfo ENOTFOUND pg报错问题", "slug": "/zh/troubleshoot/fastgpt-pg-hostname-resolve-error", "file": "troubleshoot/fastgpt-pg-hostname-resolve-error.md", "source": "https://github.com/labring/FastGPT/issues/129"}, {"id": 45, "url": "https://fastgpt.cn/troubleshoot/fastgpt-pnpm-dev-usememo-error", "title": "解决FastGPT pnpm dev启动时useMemo读取null属性报错问题", "slug": "/zh/troubleshoot/fastgpt-pnpm-dev-usememo-error", "file": "troubleshoot/fastgpt-pnpm-dev-usememo-error.md", "source": "https://github.com/labring/FastGPT/issues/440"}, {"id": 46, "url": "https://fastgpt.cn/troubleshoot/fastgpt-pnpm-install-script-error", "title": "解决FastGPT私有部署pnpm安装时的脚本缺失报错", "slug": "/zh/troubleshoot/fastgpt-pnpm-install-script-error", "file": "troubleshoot/fastgpt-pnpm-install-script-error.md", "source": "https://github.com/labring/FastGPT/issues/1499"}, {"id": 47, "url": "https://fastgpt.cn/troubleshoot/fastgpt-pnpm-install-script-error-2", "title": "解决FastGPT私有部署pnpm安装脚本缺失报错问题", "slug": "/zh/troubleshoot/fastgpt-pnpm-install-script-error-2", "file": "troubleshoot/fastgpt-pnpm-install-script-error-2.md", "source": "https://github.com/labring/FastGPT/issues/1572"}, {"id": 48, "url": "https://fastgpt.cn/troubleshoot/fastgpt-postgres-permission-error", "title": "解决FastGPT私有部署中PostgreSQL数据目录权限报错问题", "slug": "/zh/troubleshoot/fastgpt-postgres-permission-error", "file": "troubleshoot/fastgpt-postgres-permission-error.md", "source": "https://github.com/labring/FastGPT/issues/389"}, {"id": 49, "url": "https://fastgpt.cn/troubleshoot/fastgpt-private-blank-page-troubleshooting", "title": "FastGPT私有部署后页面空白且接口正常的排错方法", "slug": "/zh/troubleshoot/fastgpt-private-blank-page-troubleshooting", "file": "troubleshoot/fastgpt-private-blank-page-troubleshooting.md", "source": "https://github.com/labring/FastGPT/issues/3878"}, {"id": 50, "url": "https://fastgpt.cn/troubleshoot/fastgpt-private-deploy-47-model-dropdown-issue", "title": "解决FastGPT 4.7版本高级编排模块模型下拉框为空问题", "slug": "/zh/troubleshoot/fastgpt-private-deploy-47-model-dropdown-issue", "file": "troubleshoot/fastgpt-private-deploy-47-model-dropdown-issue.md", "source": "https://github.com/labring/FastGPT/issues/1108"}, {"id": 51, "url": "https://fastgpt.cn/troubleshoot/fastgpt-private-deploy-upload-stuck", "title": "解决FastGPT私有部署4.8.3版本大文件上传卡住问题", "slug": "/zh/troubleshoot/fastgpt-private-deploy-upload-stuck", "file": "troubleshoot/fastgpt-private-deploy-upload-stuck.md", "source": "https://github.com/labring/FastGPT/issues/1863"}, {"id": 52, "url": "https://fastgpt.cn/troubleshoot/fastgpt-private-mysql-permission-error", "title": "解决FastGPT私有部署中MySQL启动失败引发的OneAPI重启问题", "slug": "/zh/troubleshoot/fastgpt-private-mysql-permission-error", "file": "troubleshoot/fastgpt-private-mysql-permission-error.md", "source": "https://github.com/labring/FastGPT/issues/2808"}, {"id": 53, "url": "https://fastgpt.cn/troubleshoot/fastgpt-private-mysql-start-fail", "title": "解决FastGPT私有部署场景下MySQL启动失败的问题", "slug": "/zh/troubleshoot/fastgpt-private-mysql-start-fail", "file": "troubleshoot/fastgpt-private-mysql-start-fail.md", "source": "https://github.com/labring/FastGPT/issues/2425"}, {"id": 54, "url": "https://fastgpt.cn/troubleshoot/fastgpt-v47-advanced-module-model-dropdown-empty", "title": "解决FastGPT 4.7版本高级编排模块模型下拉框为空问题", "slug": "/zh/troubleshoot/fastgpt-v47-advanced-module-model-dropdown-empty", "file": "troubleshoot/fastgpt-v47-advanced-module-model-dropdown-empty.md", "source": "https://github.com/labring/FastGPT/issues/1109"}, {"id": 55, "url": "https://fastgpt.cn/troubleshoot/fastgpt-workflow-dialog-log-config-error", "title": "解决FastGPT工作流对话日志未配置商业版链接报错问题", "slug": "/zh/troubleshoot/fastgpt-workflow-dialog-log-config-error", "file": "troubleshoot/fastgpt-workflow-dialog-log-config-error.md", "source": "https://github.com/labring/FastGPT/issues/5481"}, {"id": 56, "url": "https://fastgpt.cn/troubleshoot/fastgpt-workflow-log-link-config-error", "title": "解决FastGPT点击工作流对话日志的未配置商业版链接报错问题", "slug": "/zh/troubleshoot/fastgpt-workflow-log-link-config-error", "file": "troubleshoot/fastgpt-workflow-log-link-config-error.md", "source": "https://github.com/labring/FastGPT/issues/5483"}, {"id": 57, "url": "https://fastgpt.cn/troubleshoot/wsl-fastgpt-deployment-troubleshooting", "title": "解决WSL环境下FastGPT私有部署容器启动异常问题", "slug": "/zh/troubleshoot/wsl-fastgpt-deployment-troubleshooting", "file": "troubleshoot/wsl-fastgpt-deployment-troubleshooting.md", "source": "https://github.com/labring/FastGPT/issues/1346"}, {"id": 58, "url": "https://fastgpt.cn/troubleshoot/wsl2-ubuntu-fastgpt-dependency-fail", "title": "解决WSL2 Ubuntu环境下FastGPT依赖服务启动失败问题", "slug": "/zh/troubleshoot/wsl2-ubuntu-fastgpt-dependency-fail", "file": "troubleshoot/wsl2-ubuntu-fastgpt-dependency-fail.md", "source": "https://github.com/labring/FastGPT/issues/2547"}]')
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: results=list(pool.map(check,items))
          record={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'passed':sum(r['pass'] for r in results),'total':len(results),'pages':results}
          (STAGE/'live-verification.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(record,ensure_ascii=False,indent=2))
          sys.exit(0 if record['passed']==30 else 1)
          PY
      - name: Save per-URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week05-live-verification
          path: .live-verification/live-verification.json
          include-hidden-files: true
