# Loaded inside the fastgpt.cn server block only after runtime validation succeeds.
# Keep these locations ahead of the generic trailing-slash and asset locations.

location = /customers {
    include /etc/nginx/customers-proxy-location.conf;
    include /etc/nginx/security-headers.conf;
    proxy_buffering off;
    add_header X-FastGPT-Route "customers-proxy" always;
}

location ^~ /customers/api/ {
    include /etc/nginx/customers-proxy-location.conf;
    include /etc/nginx/security-headers.conf;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-FastGPT-Route "customers-proxy" always;
}

location ^~ /customers/_next/static/ {
    include /etc/nginx/customers-proxy-location.conf;
    include /etc/nginx/security-headers.conf;
    proxy_buffering on;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-FastGPT-Route "customers-proxy" always;
}

location ^~ /customers/ {
    include /etc/nginx/customers-proxy-location.conf;
    include /etc/nginx/security-headers.conf;
    proxy_buffering off;
    add_header X-FastGPT-Route "customers-proxy" always;
}
