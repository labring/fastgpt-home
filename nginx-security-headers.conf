# Keep this policy aligned with public/_headers for the Cloudflare deployment.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.googletagmanager.com *.baidu.com hm.baidu.com track.fastgpt.cn *.feishu.cn cloudflareinsights.com *.cloudflareinsights.com rybbit.io *.rybbit.io www.clarity.ms *.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' *.fastgpt.io *.fastgpt.cn *.sealos.io *.sealoshzh.site *.googletagmanager.com *.google-analytics.com cloudflareinsights.com *.cloudflareinsights.com rybbit.io *.rybbit.io www.clarity.ms *.clarity.ms api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; media-src 'self' https:;" always;
