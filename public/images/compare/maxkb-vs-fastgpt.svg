<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Procurement and production comparison map</title>
  <desc id="desc">A neutral map connecting procurement clarity with production controls and proof of concept.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="72" y="72" width="1056" height="486" rx="24" fill="#ffffff" stroke="#dbe4f0" stroke-width="3"/>
  <text x="600" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#16243a">Procurement clarity meets production detail</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="160" y="220" width="270" height="180" rx="20" fill="#e8f0ff" stroke="#3370ff" stroke-width="4"/>
    <text x="295" y="286" font-size="25" font-weight="700" fill="#173b8f">Procurement</text>
    <text x="295" y="326" font-size="18" fill="#36547e">license · support</text>
    <text x="295" y="356" font-size="18" fill="#36547e">deployment path</text>
    <rect x="465" y="220" width="270" height="180" rx="20" fill="#fff4dc" stroke="#d88918" stroke-width="4"/>
    <text x="600" y="286" font-size="25" font-weight="700" fill="#8a5910">POC</text>
    <text x="600" y="326" font-size="18" fill="#8a5910">same workload</text>
    <text x="600" y="356" font-size="18" fill="#8a5910">measured evidence</text>
    <rect x="770" y="220" width="270" height="180" rx="20" fill="#e8f7ef" stroke="#1e9c68" stroke-width="4"/>
    <text x="905" y="286" font-size="25" font-weight="700" fill="#176b4c">Production</text>
    <text x="905" y="326" font-size="18" fill="#356850">sandbox · quota</text>
    <text x="905" y="356" font-size="18" fill="#356850">recovery · audit</text>
  </g>
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#5a6b82">three-year TCO  ·  governance  ·  contract boundaries</text>
</svg>
