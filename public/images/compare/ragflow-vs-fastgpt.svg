<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Complex document comparison map</title>
  <desc id="desc">A neutral map from complex documents through retrieval to production operations.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="72" y="72" width="1056" height="486" rx="24" fill="#ffffff" stroke="#dbe4f0" stroke-width="3"/>
  <text x="600" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#16243a">Complex documents need a complete test</text>
  <path d="M220 322h760" stroke="#b8c8dd" stroke-width="5"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="240" cy="322" r="86" fill="#e8f0ff" stroke="#3370ff" stroke-width="4"/>
    <text x="240" y="315" font-size="25" font-weight="700" fill="#173b8f">Document</text>
    <text x="240" y="348" font-size="18" fill="#36547e">layout and OCR</text>
    <circle cx="600" cy="322" r="86" fill="#fff4dc" stroke="#d88918" stroke-width="4"/>
    <text x="600" y="315" font-size="25" font-weight="700" fill="#8a5910">POC</text>
    <text x="600" y="348" font-size="18" fill="#8a5910">same corpus</text>
    <circle cx="960" cy="322" r="86" fill="#e8f7ef" stroke="#1e9c68" stroke-width="4"/>
    <text x="960" y="315" font-size="25" font-weight="700" fill="#176b4c">Operations</text>
    <text x="960" y="348" font-size="18" fill="#356850">agents and governance</text>
  </g>
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#5a6b82">parse quality  ·  retrieval evidence  ·  production workflow</text>
</svg>
