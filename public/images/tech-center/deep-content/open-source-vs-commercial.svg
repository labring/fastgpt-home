<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">开源版与商业版的功能、部署档位与支持档位关系</title>
  <desc id="desc">社区版镜像与商业版镜像组成完整应用，私有部署按需求信号分三档，原厂支持按覆盖时段与首次响应目标分四档。</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="44" y="36" width="1112" height="558" rx="20" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/>
  <text x="80" y="88" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">开源版与商业版：付费买到什么</text>
  <text x="80" y="119" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">功能镜像、私有部署档位与服务责任分开评估</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="80" y="136" width="236" height="104" rx="14" fill="#f3f6ff" stroke="#b7c9f5" stroke-width="2"/>
    <text x="198" y="168" fill="#2458d8" text-anchor="middle" font-size="14" font-weight="700">基础能力</text>
    <text x="198" y="202" fill="#172033" text-anchor="middle" font-size="23" font-weight="700">社区版镜像</text>
    <text x="198" y="226" fill="#667085" text-anchor="middle" font-size="13">自行部署 · 自行运维</text>

    <text x="336" y="200" fill="#667085" text-anchor="middle" font-size="34" font-weight="500">+</text>

    <rect x="356" y="136" width="236" height="104" rx="14" fill="#eefaf6" stroke="#a9dfce" stroke-width="2"/>
    <text x="474" y="168" fill="#17684f" text-anchor="middle" font-size="14" font-weight="700">治理与企业功能</text>
    <text x="474" y="202" fill="#172033" text-anchor="middle" font-size="23" font-weight="700">商业版镜像</text>
    <text x="474" y="226" fill="#667085" text-anchor="middle" font-size="13">权限 · 审计 · 多租户</text>

    <path d="M600 188H640" fill="none" stroke="#8eaef8" stroke-width="4"/>
    <path d="M634 179L648 188L634 197" fill="none" stroke="#8eaef8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="652" y="136" width="468" height="104" rx="14" fill="#172033"/>
    <text x="886" y="168" fill="#a9bfff" text-anchor="middle" font-size="14" font-weight="700">完整应用</text>
    <text x="886" y="202" fill="#ffffff" text-anchor="middle" font-size="23" font-weight="700">功能 + 服务</text>
    <text x="886" y="226" fill="#c6cfdd" text-anchor="middle" font-size="13">部署 · 工单 · 升级 · 托管</text>

    <rect x="80" y="262" width="328" height="104" rx="14" fill="#ffffff" stroke="#cbd7f4" stroke-width="2"/>
    <text x="108" y="294" fill="#2458d8" font-size="14" font-weight="700">私有部署 · 标准版</text>
    <text x="108" y="328" fill="#172033" font-size="21" font-weight="700">先看租户数</text>
    <text x="108" y="352" fill="#667085" font-size="13">单团队或基础私有部署</text>

    <rect x="436" y="262" width="328" height="104" rx="14" fill="#ffffff" stroke="#a9dfce" stroke-width="2"/>
    <text x="464" y="294" fill="#17684f" font-size="14" font-weight="700">私有部署 · 专业版</text>
    <text x="464" y="328" fill="#172033" font-size="21" font-weight="700">再看 SSO / OA</text>
    <text x="464" y="352" fill="#667085" font-size="13">组织协同与治理要求</text>

    <rect x="792" y="262" width="328" height="104" rx="14" fill="#ffffff" stroke="#d2c8f8" stroke-width="2"/>
    <text x="820" y="294" fill="#5443b8" font-size="14" font-weight="700">私有部署 · 旗舰版</text>
    <text x="820" y="328" fill="#172033" font-size="21" font-weight="700">最后看开票 / 支付</text>
    <text x="820" y="352" fill="#667085" font-size="13">复杂业务与扩展能力</text>

    <text x="80" y="392" fill="#172033" font-size="17" font-weight="700">原厂支持四档：覆盖时段与首次响应目标逐档递进</text>

    <rect x="80" y="460" width="248" height="80" rx="12" fill="#f4f6f9" stroke="#d5dce5" stroke-width="2"/>
