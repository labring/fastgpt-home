<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">开源版与商业版的功能和服务关系</title>
  <desc id="desc">社区版镜像与商业版镜像组成完整应用，私有部署档位按实际治理需求选择。</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="44" y="36" width="1112" height="558" rx="20" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/>
  <text x="80" y="88" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">开源版与商业版：付费买到什么</text>
  <text x="80" y="119" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">功能镜像与服务责任分开评估</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="82" y="174" width="284" height="132" rx="14" fill="#f3f6ff" stroke="#b7c9f5" stroke-width="2"/>
    <text x="224" y="217" fill="#2458d8" text-anchor="middle" font-size="16" font-weight="700">基础能力</text>
    <text x="224" y="254" fill="#172033" text-anchor="middle" font-size="25" font-weight="700">社区版镜像</text>
    <text x="224" y="281" fill="#667085" text-anchor="middle" font-size="14">自行部署 · 自行运维</text>

    <text x="400" y="252" fill="#667085" text-anchor="middle" font-size="34" font-weight="500">+</text>

    <rect x="434" y="174" width="284" height="132" rx="14" fill="#eefaf6" stroke="#a9dfce" stroke-width="2"/>
    <text x="576" y="217" fill="#17684f" text-anchor="middle" font-size="16" font-weight="700">治理与企业功能</text>
    <text x="576" y="254" fill="#172033" text-anchor="middle" font-size="25" font-weight="700">商业版镜像</text>
    <text x="576" y="281" fill="#667085" text-anchor="middle" font-size="14">权限 · 审计 · 多租户</text>

    <path d="M718 240H776" fill="none" stroke="#8eaef8" stroke-width="4"/>
    <path d="M768 230L782 240L768 250" fill="none" stroke="#8eaef8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="782" y="174" width="336" height="132" rx="14" fill="#172033"/>
    <text x="950" y="217" fill="#a9bfff" text-anchor="middle" font-size="16" font-weight="700">完整应用</text>
    <text x="950" y="254" fill="#ffffff" text-anchor="middle" font-size="25" font-weight="700">功能 + 服务</text>
    <text x="950" y="281" fill="#c6cfdd" text-anchor="middle" font-size="14">部署 · 工单 · 升级 · 托管</text>

    <text x="80" y="364" fill="#172033" font-size="20" font-weight="700">私有部署档位：按需求信号定位</text>
    <rect x="80" y="394" width="322" height="126" rx="14" fill="#ffffff" stroke="#cbd7f4" stroke-width="2"/>
    <text x="108" y="428" fill="#2458d8" font-size="15" font-weight="700">标准版</text>
    <text x="108" y="463" fill="#172033" font-size="22" font-weight="700">先看租户数</text>
    <text x="108" y="493" fill="#667085" font-size="14">单团队或基础私有部署</text>

    <rect x="439" y="394" width="322" height="126" rx="14" fill="#ffffff" stroke="#a9dfce" stroke-width="2"/>
    <text x="467" y="428" fill="#17684f" font-size="15" font-weight="700">专业版</text>
    <text x="467" y="463" fill="#172033" font-size="22" font-weight="700">再看 SSO / OA</text>
    <text x="467" y="493" fill="#667085" font-size="14">组织协同与治理要求</text>

    <rect x="798" y="394" width="322" height="126" rx="14" fill="#ffffff" stroke="#d2c8f8" stroke-width="2"/>
    <text x="826" y="428" fill="#5443b8" font-size="15" font-weight="700">旗舰版</text>
    <text x="826" y="463" fill="#172033" font-size="22" font-weight="700">最后看开票 / 支付</text>
    <text x="826" y="493" fill="#667085" font-size="14">复杂业务与扩展能力</text>
  </g>
  <text x="80" y="574" fill="#8a94a6" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">FastGPT 深度场景内容</text>
</svg>
