    <text x="104" y="520" fill="#667085" font-size="13">工作日 · 24 小时响应</text>

    <rect x="344" y="440" width="248" height="100" rx="12" fill="#f3f6ff" stroke="#b7c9f5" stroke-width="2"/>
    <text x="368" y="474" fill="#2458d8" font-size="17" font-weight="700">基础版</text>
    <text x="368" y="500" fill="#667085" font-size="13">5×8 · 4 小时响应</text>
    <text x="368" y="522" fill="#8a94a6" font-size="13">专属支持群</text>

    <rect x="608" y="422" width="248" height="118" rx="12" fill="#eefaf6" stroke="#a9dfce" stroke-width="2"/>
    <text x="632" y="456" fill="#17684f" font-size="17" font-weight="700">进阶版</text>
    <text x="632" y="482" fill="#667085" font-size="13">5×12 · 2 小时响应</text>
    <text x="632" y="504" fill="#8a94a6" font-size="13">专属支持群</text>
    <text x="632" y="526" fill="#8a94a6" font-size="13">搭建工程师 3 人天</text>

    <rect x="872" y="404" width="248" height="136" rx="12" fill="#f7f3ff" stroke="#d2c8f8" stroke-width="2"/>
    <text x="896" y="438" fill="#5443b8" font-size="17" font-weight="700">高级版</text>
    <text x="896" y="464" fill="#667085" font-size="13">7×24 · 1 小时响应</text>
    <text x="896" y="486" fill="#8a94a6" font-size="13">专属支持群 + 客户经理</text>
    <text x="896" y="508" fill="#8a94a6" font-size="13">搭建工程师 10 人天</text>
    <text x="896" y="530" fill="#8a94a6" font-size="13">专家咨询 1 次</text>
  </g>
  <text x="80" y="574" fill="#8a94a6" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">FastGPT 深度场景内容</text>
