<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">开源 AI 应用平台选型的五个固定变量</title>
  <desc id="desc">许可证边界、部署门槛、治理能力版本、原厂支持与责任边界、三年总成本，各自的判定问题汇入同条件 POC 前提。</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="44" y="36" width="1112" height="558" rx="20" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/>
  <text x="80" y="88" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">平台选型：五个固定比较变量</text>
  <text x="80" y="119" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">每个变量各有判定问题，确认之后汇入同一条件</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="80" y="150" width="632" height="72" rx="12" fill="#f3f6ff" stroke="#b7c9f5" stroke-width="2"/>
    <rect x="80" y="150" width="8" height="72" rx="4" fill="#326dff"/>
    <text x="106" y="178" fill="#2458d8" font-size="14" font-weight="700">变量 01</text>
    <text x="178" y="180" fill="#172033" font-size="21" font-weight="700">许可证边界</text>
    <text x="106" y="206" fill="#667085" font-size="14">判定问题：能否用于 SaaS、去品牌与二次分发</text>

    <rect x="80" y="230" width="632" height="72" rx="12" fill="#eefaf6" stroke="#a9dfce" stroke-width="2"/>
    <rect x="80" y="230" width="8" height="72" rx="4" fill="#2fcaa0"/>
    <text x="106" y="258" fill="#17684f" font-size="14" font-weight="700">变量 02</text>
    <text x="178" y="260" fill="#172033" font-size="21" font-weight="700">部署门槛</text>
    <text x="106" y="286" fill="#667085" font-size="14">判定问题：资源下限、架构与运维栈是否具备</text>

    <rect x="80" y="310" width="632" height="72" rx="12" fill="#fff8e8" stroke="#efd491" stroke-width="2"/>
    <rect x="80" y="310" width="8" height="72" rx="4" fill="#f0b429"/>
    <text x="106" y="338" fill="#725116" font-size="14" font-weight="700">变量 03</text>
    <text x="178" y="340" fill="#172033" font-size="21" font-weight="700">治理能力所属版本</text>
    <text x="106" y="366" fill="#667085" font-size="14">判定问题：SSO、权限、审计、配额落在哪一档</text>

    <rect x="80" y="390" width="632" height="72" rx="12" fill="#f7f3ff" stroke="#d2c8f8" stroke-width="2"/>
    <rect x="80" y="390" width="8" height="72" rx="4" fill="#8b7cf6"/>
    <text x="106" y="418" fill="#5443b8" font-size="14" font-weight="700">变量 04</text>
    <text x="178" y="420" fill="#172033" font-size="21" font-weight="700">原厂支持与责任边界</text>
    <text x="106" y="446" fill="#667085" font-size="14">判定问题：覆盖时段、响应目标与故障恢复由谁负责</text>

    <rect x="80" y="470" width="632" height="72" rx="12" fill="#eef9fc" stroke="#a9dbe8" stroke-width="2"/>
    <rect x="80" y="470" width="8" height="72" rx="4" fill="#0e9ab8"/>
    <text x="106" y="498" fill="#0b6a80" font-size="14" font-weight="700">变量 05</text>
    <text x="178" y="500" fill="#172033" font-size="21" font-weight="700">三年总成本</text>
    <text x="106" y="526" fill="#667085" font-size="14">判定问题：许可、模型、运维、升级、退出按同一口径</text>
  </g>

  <path d="M716 346H736" fill="none" stroke="#9aa7ba" stroke-width="3"/>
  <path d="M730 339L741 346L730 353" fill="none" stroke="#9aa7ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="748" y="150" width="372" height="392" rx="16" fill="#172033"/>
  <text x="780" y="194" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">同条件 POC 前提</text>
  <text x="780" y="222" fill="#c6cfdd" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">五个变量都确认之后，再跑一遍对比</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">
    <rect x="780" y="248" width="308" height="56" rx="10" fill="#26324a"/>
    <text x="934" y="283" fill="#ffffff" text-anchor="middle">同一黄金集</text>
    <rect x="780" y="314" width="308" height="56" rx="10" fill="#26324a"/>
    <text x="934" y="349" fill="#ffffff" text-anchor="middle">同一模型</text>
    <rect x="780" y="380" width="308" height="56" rx="10" fill="#26324a"/>
    <text x="934" y="415" fill="#ffffff" text-anchor="middle">同一机型</text>
    <rect x="780" y="446" width="308" height="56" rx="10" fill="#26324a"/>
    <text x="934" y="481" fill="#ffffff" text-anchor="middle">同一数据量</text>
  </g>
  <text x="80" y="574" fill="#8a94a6" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">FastGPT 深度场景内容</text>
</svg>
